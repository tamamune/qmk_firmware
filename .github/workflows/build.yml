name: Build DOIO KB16 Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firmware
        run: |
          # Gitの所有権エラー (status 128) 回避
          git config --global --add safe.directory "*"

          # ※リポジトリ内のキーマップフォルダ名に合わせて -km を変更してください
          qmk compile -kb doio/kb16/rev1 -km tamamune

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: doio-kb16-firmware
          path: |
            *.hex
            *.bin
            *.uf2
