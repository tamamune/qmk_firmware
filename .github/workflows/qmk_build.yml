name: Build KillerWhale Firmware

on:
  push:
    branches:
      - tarohayashi
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ここが重要：履歴をすべて取得しないとQMKのビルドシステムが壊れることがあります
          fetch-depth: 0
          submodules: recursive

      - name: Build firmware
        run: |
          # エラーが出やすい setup ではなく、直接必要なサブモジュールだけ更新を試みる
          git config --global --add safe.directory /__w/qmk_firmware/qmk_firmware
          make git-submodule
          qmk compile -kb tarohayashi/killerwhale/duo -km test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: killerwhale-firmware
          path: ./*.uf2
