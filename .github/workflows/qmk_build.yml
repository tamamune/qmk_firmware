name: Build KillerWhale Firmware

on:
  push:
    branches:
      - tarohayashi
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v3 から v4 に修正
        with:
          submodules: recursive

      - name: Build firmware
        run: |
          qmk setup -y
          qmk compile -kb tarohayashi/killerwhale/duo -km test

      - name: Upload artifact
        uses: actions/upload-artifact@v4 # v3 から v4 に修正
        with:
          name: killerwhale-firmware
          path: ./*.uf2
